<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DV3D — Contatti</title>
  <meta name="description" content="DV3D — Stampa 3D e prototipazione rapida. Contattaci su Instagram o via email."/>
  <style>
    :root{
      --bg1: #05121a;
      --bg2: #062733;
      --brand-azure: #00b4d8; /* azzurro DV3D */
      --brand-azure-dark: #0097b2;
      --brand-orange: #ff8a00; /* arancione DV3D */
      --brand-orange-light: #ff8a00;
      --card: rgba(255,255,255,0.03);
      --text: #e9f6fb;
      --muted: rgba(233,246,251,0.75);
      --max-width: 980px;
      --btn-radius: 12px;
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(0,180,216,0.06), transparent 15%),
        linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      box-sizing:border-box;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
      margin:0 auto;
      text-align:center;
      position: relative; /* <<-- ADDED: rende la container il reference per i pulsanti assoluti */
    }

    /* Hero / logo */
    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:24px;
      margin-bottom:18px;
    }
    .logo-wrap{
      width:min(56vw, 540px);
      max-width:540px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto;
      pointer-events: none; /* non intercetta i click */
    }
    .logo{
      width:100%;
      height:auto;
      object-fit:contain;
      filter: drop-shadow(0 18px 50px rgba(0,180,216,0.10));
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }

    /* Buttons area */
    .card{
      display:flex;
      gap:16px;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      margin-top:8px;
      position:absolute;      /* <<-- MODIFIED: posizione assoluta per sovrapporre sotto il logo */
      left:50%;
      top:55%;                /* posiziona verticalmente circa sotto il logo */
      transform:translate(-50%, -8%); /* centra orizzontalmente e sposta leggermente in alto per "sovrapporre" */
      z-index:1200; /* assicura priorità click */
      transition: top .18s ease, transform .18s ease;
    }

    a.btn{
      display:inline-flex;
      align-items:center;
      gap:12px;
      padding:14px 22px;
      border-radius:var(--btn-radius);
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
      border:0;
      transition: transform .16s ease, box-shadow .16s ease, background .18s ease, color .12s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      color: #02110a;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Stato NORMALE: entrambi azzurri */
    .btn-email,
    .btn-ig {
      background: linear-gradient(180deg, var(--brand-azure), var(--brand-azure-dark));
      color: #02110a;
      border: 1px solid rgba(255,255,255,0.03);
    }

    /* Stato HOVER: entrambi arancioni */
    .btn-email:hover,
    .btn-ig:hover {
      background: linear-gradient(180deg, var(--brand-orange-light), var(--brand-orange));
      color: #02110a;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(255,138,0,0.30);
    }

    /* Focus accessibile */
    .btn:focus {
      outline: 3px solid rgba(0,180,216,0.18);
      outline-offset: 3px;
    }

    /* Icon sizing */
    .btn svg{width:20px;height:20px;flex:0 0 20px; display:block}

    .hint{
      margin-top:14px;
      color:var(--muted);
      font-size:0.92rem;
    }

    /* Mobile adjustments */
    @media (max-width:540px){
      .logo-wrap{ width:84vw; max-width:420px; }
      .btn{ padding:12px 14px; gap:10px; border-radius:10px; font-size:0.96rem; }
      .card{ gap:10px; padding:0 8px; left:50%; top:62%; transform:translate(-50%, -0%); } /* regola mobile: sposta i bottoni più in basso */
      .btn-email, .btn-ig { width: 100%; justify-content:center; }
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-labelledby="pageTitle">
    <header class="hero" aria-hidden="false">
      <div class="logo-wrap" role="img" aria-label="Logo DV3D">
        <!-- Metti qui il file logo.png nella stessa cartella -->
        <img src="logo.png" alt="DV3D logo" class="logo" />
      </div>
    </header>

    <section class="card" aria-label="Contatti rapidi">
      <!-- Email -->
      <a id="btn-email" class="btn btn-email"
         href="mailto:printdv3D@gmail.com"
         title="Invia una email a printdv3D@gmail.com"
         role="button"
         aria-label="Invia email a printdv3D">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z" fill="#02110a" opacity=".95"/>
          <path d="M4.5 6.5l7.5 5 7.5-5" stroke="#02110a" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Scrivici via email</span>
      </a>

      <!-- Instagram -->
      <a class="btn btn-ig"
         href="https://instagram.com/D.V_3D"
         target="_blank" rel="noopener noreferrer"
         title="Apri la nostra pagina Instagram @D.V_3D"
         aria-label="Apri Instagram DV3D">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.2" />
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.2" />
          <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" />
        </svg>
        <span>Apri Instagram</span>
      </a>
    </section>

    <p class="hint" id="pageTitle">DV3D — Stampa e prototipazione 3Dd. Scegli come contattarci.</p>
  </main>

  <!-- Piccolo script per garantire che link mail funzioni su tutti i dispositivi (fallback) -->
  <script>
    // Assicura che il bottone email abbia attributi corretti e non venga sovrascritto da altri script
    (function(){
      var btn = document.getElementById('btn-email');
      if(!btn){
        return;
      }
      // sicurezza: forziamo href corretto se mancante
      if(!btn.getAttribute('href') || btn.getAttribute('href').indexOf('mailto:') === -1){
        btn.setAttribute('href','mailto:printdv3D@gmail.com');
      }
      // rendi il bottone cliccabile in ogni caso
      btn.style.pointerEvents = 'auto';
    })();
  </script>
</body>
</html>
