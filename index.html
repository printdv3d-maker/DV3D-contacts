<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DV3D — Contatti</title>
  <meta name="description" content="DV3D — Stampa 3D e prototipazione rapida. Contattaci su Instagram o via email."/>
  <style>
    :root{
      --bg1:#05121a;
      --bg2:#062733;
      --brand-azure:#00b4d8;
      --brand-azure-dark:#0097b2;
      --brand-orange:#ff8a00;
      --brand-orange-light:#ffb347;
      --text:#e9f6fb;
      --muted:rgba(233,246,251,0.75);
    }

    html,body{height:100%;margin:0;}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      font-family:Inter,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;
      background:
        radial-gradient(circle at 50% 20%,rgba(0,180,216,0.06),transparent 15%),
        linear-gradient(180deg,var(--bg2) 0%,var(--bg1) 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .container{
      position:relative;
      text-align:center;
      width:100%;
      max-width:700px;
      padding:20px;
    }

    .logo-wrap{
      position:relative;
      width:100%;
      max-width:540px;
      margin:0 auto;
    }
    .logo{
      width:100%;
      height:auto;
      display:block;
      margin:0 auto;
      filter:drop-shadow(0 12px 35px rgba(0,180,216,0.1));
      pointer-events:none;
      user-select:none;
    }

    /* PULSANTI SOVRAPPOSTI */
    .card{
      position:absolute;
      bottom:-30px; /* sposta sotto il logo */
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:18px;
      flex-wrap:wrap;
      justify-content:center;
      z-index:10;
    }

    a.btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:14px 22px;
      border-radius:12px;
      font-weight:600;
      text-decoration:none;
      cursor:pointer;
      border:none;
      transition:all .18s ease-in-out;
      color:#02110a;
      background:linear-gradient(180deg,var(--brand-azure),var(--brand-azure-dark));
      box-shadow:0 6px 22px rgba(0,180,216,0.25);
    }

    a.btn:hover{
      background:linear-gradient(180deg,var(--brand-orange-light),var(--brand-orange));
      box-shadow:0 10px 28px rgba(255,138,0,0.35);
      transform:translateY(-3px);
    }

    .btn svg{width:20px;height:20px;flex-shrink:0;}
    .hint{margin-top:70px;font-size:0.9rem;color:var(--muted);}

    @media(max-width:540px){
      .logo-wrap{max-width:400px;}
      .card{bottom:-25px;gap:10px;}
      .btn{padding:12px 14px;font-size:0.95rem;}
      .btn{width:100%;justify-content:center;}
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-wrap">
      <img src="logo.png" alt="Logo DV3D" class="logo"/>
      <section class="card">
        <a href="mailto:printdv3D@gmail.com" class="btn" title="Scrivici via email">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5C3 5.67 3.67 5 4.5 5h15c.83 0 1.5.67 1.5 1.5v11c0 .83-.67 1.5-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11z" fill="#02110a" opacity=".95"/><path d="M4.5 6.5l7.5 5 7.5-5" stroke="#02110a" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Email</span>
        </a>
        <a href="https://instagram.com/D.V_3D" target="_blank" rel="noopener noreferrer" class="btn" title="Apri Instagram">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.2"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
          <span>Instagram</span>
        </a>
      </section>
    </div>
    <p class="hint">DV3D — Stampa e prototipazione 3D</p>
  </main>
</body>
</html>
